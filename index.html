<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Farming - Dashboard IoT</title>
  <!-- Library Chart.js untuk Membuat Grafik -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { color: #2e7d32; text-align: center; margin-top: 0; }
    .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .btn-google { background-color: #4285F4; color: white; display: block; margin: 20px auto; }
    .btn-logout { background-color: #e53935; color: white; float: right; }
    .hidden { display: none; }
    .status-card { background: #e8f5e9; padding: 15px; border-radius: 8px; margin-bottom: 20px; border-left: 5px solid #2e7d32; }
    canvas { max-width: 100%; margin-top: 20px; }
  </style>
</head>
<body>

  <div class="container">
    <h2>🌱 Smart Farming Dashboard</h2>

    <!-- Halaman Sebelum Login -->
    <div id="login-box">
      <p style="text-align: center;">Silakan login dengan akun Gmail untuk melihat data grafik IoT Realtime.</p>
      <button id="btn-login" class="btn btn-google">🔑 Login dengan Gmail</button>
    </div>

    <!-- Halaman Setelah Login -->
    <div id="app-box" class="hidden">
      <button id="btn-logout" class="btn btn-logout">Logout</button>
      <p>Halo, <b id="user-name">Pengguna</b>!</p>

      <div class="status-card">
        <h3>Nilai Sensor Terakhir</h3>
        <p><strong>Kelembapan / Suhu:</strong> <span id="latest-val">Memuat...</span></p>
        <p><strong>Waktu Terakhir:</strong> <span id="latest-time">-</span></p>
      </div>

      <h3>Grafik Riwayat Waktu Nyata (Hari & Tanggal)</h3>
      <canvas id="iotChart"></canvas>
    </div>
  </div>

  <!-- Firebase Web SDK v10 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Konfigurasi Firebase khusus milik proyek Smart-Farming-Pondok kamu
    const firebaseConfig = {
      apiKey: "AIzaSyDanCgQsRQixjU4yefyAuqOTzMK8YZtg2c",
      authDomain: "smart-farming-pondok.firebaseapp.com",
      databaseURL: "https://smart-farming-pondok-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "smart-farming-pondok",
      storageBucket: "smart-farming-pondok.firebasestorage.app",
      messagingSenderId: "214802682515",
      appId: "1:214802682515:web:215a0d1d199022a33f7366",
      measurementId: "G-W8T6JH7SJG"
    };

    // Inisialisasi Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);
    const provider = new GoogleAuthProvider();

    // Elemen Tampilan
    const loginBox = document.getElementById('login-box');
    const appBox = document.getElementById('app-box');
    const btnLogin = document.getElementById('btn-login');
    const btnLogout = document.getElementById('btn-logout');
    const userName = document.getElementById('user-name');
    const latestVal = document.getElementById('latest-val');
    const latestTime = document.getElementById('latest-time');

    // Inisialisasi Grafik Chart.js
    const ctx = document.getElementById('iotChart').getContext('2d');
    const chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [], // Mengisi Hari & Tanggal otomatis dari Firebase
        datasets: [{
          label: 'Data Sensor IoT',
          data: [], // Mengisi Angka Sensor dari Firebase
          borderColor: '#2e7d32',
          backgroundColor: 'rgba(46, 125, 50, 0.1)',
          fill: true,
          tension: 0.3
        }]
      },
      options: {
        responsive: true,
        scales: {
          x: { title: { display: true, text: 'Hari & Tanggal' } },
          y: { title: { display: true, text: 'Nilai Sensor' } }
        }
      }
    });

    // 1. Fitur Login & Logout Gmail
    btnLogin.addEventListener('click', () => signInWithPopup(auth, provider));
    btnLogout.addEventListener('click', () => signOut(auth));

    // Cek Status Login Pengguna
    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginBox.classList.add('hidden');
        appBox.classList.remove('hidden');
        userName.textContent = user.displayName;
        loadIoTData();
      } else {
        loginBox.classList.remove('hidden');
        appBox.classList.add('hidden');
      }
    });

    // 2. Membaca Data Realtime dari Firebase
    function loadIoTData() {
      const dbRef = ref(database, 'sensor_history');
      onValue(dbRef, (snapshot) => {
        const data = snapshot.val();
        if (data) {
          const labels = [];
          const values = [];

          // Membaca data yang masuk dari Firebase
          Object.keys(data).forEach(key => {
            labels.push(data[key].waktu); // Hari & Tanggal
            values.push(data[key].nilai); // Nilai Sensor
          });

          // Meng-update Grafik
          chart.data.labels = labels;
          chart.data.datasets[0].data = values;
          chart.update();

          // Tampilkan Nilai Terakhir
          latestVal.textContent = values[values.length - 1];
          latestTime.textContent = labels[labels.length - 1];
        }
      });
    }
  </script>
</body>
</html>
