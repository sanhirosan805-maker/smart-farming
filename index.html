<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Farming - LoRa Dashboard</title>
  
  <!-- Chart.js & FontAwesome Icons -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', 'Segoe UI', sans-serif; }
    
    body { 
      background: linear-gradient(135deg, #e0f2fe 0%, #f0fdf4 100%); 
      color: #1e293b; 
      min-height: 100vh; 
      padding: 15px; 
    }

    /* ================= HALAMAN LOGIN ================= */
    #login-page {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 90vh;
    }

    .login-card {
      background: #ffffff;
      padding: 35px 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 380px;
      text-align: center;
      border: 1px solid #e2e8f0;
    }

    .login-card i.logo-icon {
      font-size: 3.5rem;
      color: #10b981;
      margin-bottom: 15px;
    }

    .login-card h2 {
      font-size: 1.5rem;
      color: #0f172a;
      margin-bottom: 5px;
    }

    .login-card p {
      font-size: 0.85rem;
      color: #64748b;
      margin-bottom: 25px;
    }

    .input-group {
      margin-bottom: 15px;
      text-align: left;
    }

    .input-group label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #475569;
      display: block;
      margin-bottom: 5px;
    }

    .input-group input {
      width: 100%;
      padding: 12px 15px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
    }

    .input-group input:focus {
      border-color: #10b981;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      background: #10b981;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 10px;
    }

    .btn-login:hover {
      background: #059669;
    }

    /* ================= DASHBOARD UTAMA ================= */
    #dashboard-page {
      display: none;
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      background: #ffffff;
      padding: 16px 20px;
      border-radius: 16px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      border: 1px solid #e2e8f0;
    }

    header h1 {
      font-size: 1.2rem;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-badge {
      background: #dcfce7;
      color: #15803d;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* KOTAK GRAFIK PISAH (HAMA & GULMA) */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
    }

    .box-card {
      background: #ffffff;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
    }

    .box-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .box-title {
      font-size: 1.1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .box-val {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .chart-box {
      position: relative;
      height: 220px;
      width: 100%;
      margin: 15px 0;
    }

    .btn-spray {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      color: white;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: opacity 0.2s;
    }

    .btn-spray:hover { opacity: 0.9; }

    .btn-hama { background: #ef4444; }
    .btn-gulma { background: #f59e0b; }

    .spray-status {
      font-size: 0.8rem;
      font-weight: 600;
      margin-top: 8px;
      text-align: center;
      color: #64748b;
    }
  </style>
</head>
<body>

  <!-- 1. HALAMAN LOGIN -->
  <div id="login-page">
    <div class="login-card">
      <i class="fa-solid fa-wheat-awn logo-icon"></i>
      <h2>Smart Farming</h2>
      <p>Masuk untuk memantau sawah via LoRa</p>
      
      <form onsubmit="handleLogin(event)">
        <div class="input-group">
          <label>Username</label>
          <input type="text" id="username" placeholder="Masukkan nama..." required>
        </div>
        <div class="input-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-login">Masuk Dashboard</button>
      </form>
    </div>
  </div>

  <!-- 2. DASHBOARD UTAMA -->
  <div id="dashboard-page">
    <header>
      <h1><i class="fa-solid fa-microchip" style="color: #10b981;"></i> Monitoring Sawah LoRa</h1>
      <div class="status-badge"><i class="fa-solid fa-wifi"></i> LoRa Connected</div>
    </header>

    <div class="dashboard-grid">
      
      <!-- KOTAK GRAFIK HAMA -->
      <div class="box-card">
        <div class="box-header">
          <div class="box-title" style="color: #ef4444;"><i class="fa-solid fa-bug"></i> Hama Serangga</div>
          <span style="font-size: 0.8rem; color: #64748b;">Max: 20 Ekor</span>
        </div>
        <div id="val-hama" class="box-val" style="color: #ef4444;">8 Ekor</div>
        
        <!-- Grafik Hama -->
        <div class="chart-box">
          <canvas id="hamaChart"></canvas>
        </div>

        <button class="btn-spray btn-hama" onclick="semprot('HAMA')">
          <i class="fa-solid fa-spray-can-sparkles"></i> Semprot Pestisida
        </button>
        <div id="status-hama" class="spray-status">Status Pompa: Standby</div>
      </div>

      <!-- KOTAK GRAFIK GULMA -->
      <div class="box-card">
        <div class="box-header">
          <div class="box-title" style="color: #f59e0b;"><i class="fa-solid fa-plant-wilt"></i> Cakupan Gulma</div>
          <span style="font-size: 0.8rem; color: #64748b;">Max: 15%</span>
        </div>
        <div id="val-gulma" class="box-val" style="color: #f59e0b;">12%</div>
        
        <!-- Grafik Gulma -->
        <div class="chart-box">
          <canvas id="gulmaChart"></canvas>
        </div>

        <button class="btn-spray btn-gulma" onclick="semprot('GULMA')">
          <i class="fa-solid fa-shower"></i> Semprot Herbisida
        </button>
        <div id="status-gulma" class="spray-status">Status Pompa: Standby</div>
      </div>

    </div>
  </div>

  <script>
    let hamaVal = 8;
    let gulmaVal = 12;
    let hamaChart, gulmaChart;

    function handleLogin(e) {
      e.preventDefault();
      document.getElementById('login-page').style.display = 'none';
      document.getElementById('dashboard-page').style.display = 'block';
      initCharts();
    }

    function getTime() {
      const d = new Date();
      return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') + ':' + String(d.getSeconds()).padStart(2, '0');
    }

    function initCharts() {
      // Grafik Hama
      const ctxH = document.getElementById('hamaChart').getContext('2d');
      hamaChart = new Chart(ctxH, {
        type: 'line',
        data: {
          labels: [getTime()],
          datasets: [{ label: 'Jumlah Hama', data: [hamaVal], borderColor: '#ef4444', backgroundColor: 'rgba(239, 68, 68, 0.1)', fill: true, tension: 0.3 }]
        },
        options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }
      });

      // Grafik Gulma
      const ctxG = document.getElementById('gulmaChart').getContext('2d');
      gulmaChart = new Chart(ctxG, {
        type: 'line',
        data: {
          labels: [getTime()],
          datasets: [{ label: 'Cakupan Gulma (%)', data: [gulmaVal], borderColor: '#f59e0b', backgroundColor: 'rgba(245, 158, 11, 0.1)', fill: true, tension: 0.3 }]
        },
        options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true } } }
      });
    }

    function semprot(tipe) {
      if (tipe === 'HAMA') {
        const st = document.getElementById('status-hama');
        st.innerText = "Status Pompa: Menyemprot...";
        st.style.color = "#ef4444";
        setTimeout(() => {
          hamaVal = Math.max(0, hamaVal - 3);
          document.getElementById('val-hama').innerText = hamaVal + ' Ekor';
          st.innerText = "Status Pompa: Standby";
          st.style.color = "#64748b";
          updateChart(hamaChart, hamaVal);
        }, 2000);
      } else {
        const st = document.getElementById('status-gulma');
        st.innerText = "Status Pompa: Menyemprot...";
        st.style.color = "#f59e0b";
        setTimeout(() => {
          gulmaVal = Math.max(0, gulmaVal - 4);
          document.getElementById('val-gulma').innerText = gulmaVal + '%';
          st.innerText = "Status Pompa: Standby";
          st.style.color = "#64748b";
          updateChart(gulmaChart, gulmaVal);
        }, 2000);
      }
    }

    function updateChart(chart, val) {
      chart.data.labels.push(getTime());
      chart.data.datasets[0].data.push(val);
      if (chart.data.labels.length > 6) {
        chart.data.labels.shift();
        chart.data.datasets[0].data.shift();
      }
      chart.update();
    }
  </script>
</body>
</html>
